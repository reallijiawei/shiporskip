name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx @opennextjs/cloudflare build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://olhzndnzjvoiqbpzedlp.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9saHpuZG56anZvaXFicHplZGxwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5NDQwMTYsImV4cCI6MjA5NTUyMDAxNn0.ErRFJ6BFSalHlM41-mRX6q7buVaMGLLVFHisj-FuiMQ
          NEXT_PUBLIC_APP_URL: https://shiporskip.org

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --keep-vars
